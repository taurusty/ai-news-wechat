timezone: Asia/Shanghai
output:
  base_dir: ./output
  image_mode: relative  # B: relative paths in HTML

limits:
  summary_max_chars: 1000

columns:
  # 第一栏：每日资讯
  # 从以下网站爬取：机器之心、AIERA、Engadget、CNET、TechCrunch AI
  # 至少5条最多10条，不足时从前一天补充
  - name: "每日资讯"
    min_items: 5
    max_items: 10
    sources:
      - name: jiqizhixin
        weight: 1.2
      - name: aiera
        weight: 1.0
      - name: engadget
        weight: 0.9
      - name: cnet
        weight: 0.9
      - name: techcrunch_ai
        weight: 1.1

  # 第二栏：科创头条
  # 从科创板日报（chinastarmarket.cn）爬取
  # 从阅读量排名前10中选取最少5条，最多10条
  # 总结文章要点，把事情讲清楚，包含结论
  - name: "科创头条"
    min_items: 5
    max_items: 10
    sources:
      - name: chinastarmarket
        weight: 1.0

  # 第三栏：学术动态
  # 从 arXiv cs.AI 爬取（周一至周五）
  # 每天抓取前20篇文章，选取通俗易懂的前10条
  # 总结研究要点和结论，当天不足20条就爬取前一天的
  - name: "学术动态"
    enabled_weekdays: [0, 1, 2, 3, 4]  # 周一至周五
    min_items: 10
    max_items: 10
    max_items_considered: 20  # 从前20篇中选10篇
    sources:
      - name: arxiv_cs_ai
        weight: 1.0

filter:
  keywords_any:
    - AI
    - 人工智能
    - 大模型
    - LLM
    - Agent
    - 生成式
    - 推理
    - 机器学习
    - 深度学习
    - 芯片
    - CUDA
    - NVIDIA
    - OpenAI
    - Anthropic
    - Google
    - Gemini
    - Meta
    - Llama
    - 微软
    - Copilot
    - Stable Diffusion
    - Midjourney
    - Sora
  keywords_not:
    - 彩票
    - 星座

ranking:
  max_items_considered: 40
  top_k_for_article: 10

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  model_env: DEEPSEEK_MODEL
  api_key_env: DEEPSEEK_API_KEY
  relevance_check: true

timeouts:
  # 单个source抓取（列表页+多篇详情）整体最长耗时，超时则跳过该source
  per_source_seconds: 30  # 增加到30秒，避免超时
  # arXiv 需要访问多个 abs 页面，需要更长时间
  arxiv_source_seconds: 120

images:
  use_original_images: true
  generate_cover: true
  generate_separators: true
  cover:
    width: 900
    height: 500
