timezone: Asia/Shanghai
output:
  base_dir: ./output
  image_mode: relative  # B: relative paths in HTML

limits:
  summary_max_chars: 1000

columns:
  - name: "每日简报"
    min_items: 5
    max_items: 10
    sources:
      - name: jiqizhixin
        weight: 1.2
      - name: aiera
        weight: 1.0
      - name: engadget
        weight: 0.9
      - name: cnet
        weight: 0.9
      - name: techcrunch_ai
        weight: 1.1

  - name: "科创热点"
    min_items: 5
    max_items: 10
    sources:
      - name: chinastarmarket
        weight: 1.0

  - name: "学术动态"
    # 周一至周五发布
    enabled_weekdays: [0, 1, 2, 3, 4]
    min_items: 10
    max_items: 10
    # Arxiv只取前20篇精选，不需要更多
    max_items_considered: 20
    sources:
      - name: arxiv_cs_ai
        weight: 1.0

filter:
  keywords_any:
    - AI
    - 人工智能
    - 大模型
    - LLM
    - Agent
    - 生成式
    - 推理
    - 机器学习
    - 深度学习
    - 芯片
    - CUDA
    - NVIDIA
    - OpenAI
    - Anthropic
    - Google
    - Gemini
    - Meta
    - Llama
    - 微软
    - Copilot
    - Stable Diffusion
    - Midjourney
    - Sora
  keywords_not:
    - 彩票
    - 星座

ranking:
  max_items_considered: 40
  top_k_for_article: 10

llm:
  provider: deepseek
  base_url: https://api.deepseek.com
  model_env: DEEPSEEK_MODEL
  api_key_env: DEEPSEEK_API_KEY
  relevance_check: true

timeouts:
  # 单个source抓取（列表页+多篇详情）整体最长耗时，超时则跳过该source
  per_source_seconds: 30  # 增加到30秒，避免超时
  # arXiv 需要访问多个 abs 页面，需要更长时间
  arxiv_source_seconds: 120

images:
  use_original_images: true
  generate_cover: true
  generate_separators: true
  cover:
    width: 900
    height: 500
